# 테스트 전용. Docker/PostgreSQL 없이 인메모리 H2 로 컨텍스트를 띄운다.
# 실제 PostgreSQL 방언 검증이 필요한 리포지토리 테스트는 이후 Testcontainers 로 별도 구성한다.
spring:
  datasource:
    url: jdbc:h2:mem:codit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # data.sql 자동 실행은 슬라이스 테스트(@DataJpaTest)에서 스키마 생성보다 먼저 돌아
  # "테이블 없음" 오류가 나므로 테스트에서는 끄고, 필요한 테스트에서 @Sql로 명시 실행한다.
  sql:
    init:
      mode: never

jwt:
  secret: test-only-secret-key-for-context-loads-min-32-bytes
  access-token-expiry-seconds: 3600
