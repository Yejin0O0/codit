spring:
  application:
    name: backend
  datasource:
    # 로컬 기본값 = docker-compose.yml 의 PostgreSQL.
    # 배포(RDS)는 환경변수 DB_URL / DB_USERNAME / DB_PASSWORD 로 주입한다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codit}
    username: ${DB_USERNAME:codit}
    password: ${DB_PASSWORD:codit}
  jpa:
    hibernate:
      # MVP 단계: 엔티티 변경 시 스키마 자동 반영.
      # 배포 전에 Flyway 도입하고 validate 로 전환한다.
      ddl-auto: update
    open-in-view: false
    show-sql: true
    # data.sql(태그 초기 시딩)이 Hibernate의 자동 스키마 생성 이후에 실행되도록 순서를 미룬다.
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

server:
  port: 8080

jwt:
  # 공개 저장소에 안전한 기본값을 둘 수 없으므로 기본값 없이 강제한다.
  # 로컬 개발은 backend/.env 의 JWT_SECRET 을 사용한다. 미설정 시 기동이 실패한다.
  secret: ${JWT_SECRET}
  access-token-expiry-seconds: ${JWT_ACCESS_TOKEN_EXPIRY_SECONDS:3600}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

springdoc:
  # 컨트롤러 코드에서 API 문서를 자동 생성한다. http://localhost:8080/swagger-ui.html
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: list
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
