# 로컬 개발용 PostgreSQL.
#   시작:   cd backend && docker compose up -d
#   중지:   docker compose down       (데이터 유지)
#   초기화: docker compose down -v    (볼륨까지 삭제)
services:
  db:
    image: postgres:16
    container_name: codit-postgres
    environment:
      POSTGRES_DB: codit
      POSTGRES_USER: codit
      POSTGRES_PASSWORD: codit
    ports:
      - "5432:5432"
    volumes:
      - codit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codit -d codit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  codit-pgdata:
