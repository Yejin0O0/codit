<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <title>SWEA mock 풀이 페이지 — solvingProblem.do 형식 (e2e #37)</title>
    </head>
    <body>
        <!--
          solvingProblem.do 형식 실측 기반. contestProbId 는 URL 에 없고 hidden
          input 에만 있다(#17). 제목 텍스트는 problemDetail.do 와 일부러 다르게
          둔다 — 같은 문제여도 페이지마다 표시 포맷이 다를 수 있음을 재현해,
          캐싱이 없으면 제목이 바뀌어 보인다는 걸 검증한다(#37).
        -->
        <form id="mainForm">
            <input type="hidden" id="contestProbId" name="contestProbId" value="E2E-TITLE-001" />
        </form>
        <p class="problem_title">
            [S/W 문제해결 기본] 다른 표시 포맷 - DNA 수열
            <span class="badge badge-a">D3</span>
        </p>
    </body>
</html>
