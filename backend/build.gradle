plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'checkstyle'
	id 'jacoco'
}

group = 'com.codit'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// API 문서 (Swagger UI). Spring Boot 4.x 는 springdoc 3.x 사용
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// javac 가 .java 소스를 읽을 때 쓰는 인코딩. 미지정 시 플랫폼 기본 charset
// (Windows 한글 = MS949)으로 읽혀 소스의 한글 문자열 리터럴이 컴파일 시점에 깨진다.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'file.encoding', 'UTF-8'
}

tasks.named('bootRun') {
	jvmArgs '-Dfile.encoding=UTF-8'
	// TODO: Dockerfile / 배포 스크립트 추가 시 java -jar 실행에도 -Dfile.encoding=UTF-8 명시 필요
	doFirst {
		def envFile = file('.env')
		if (envFile.exists()) {
			// 지원 형식: KEY=VALUE, export KEY=VALUE, KEY="VALUE" / KEY='VALUE' (따옴표는 벗겨서 주입)
			def loadedCount = 0
			envFile.eachLine { line ->
				def matcher = line =~ /^(?:export\s+)?(GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|JWT_SECRET)=["']?(.+?)["']?$/
				if (matcher.matches()) {
					environment matcher.group(1), matcher.group(2)
					loadedCount++
				}
			}
			logger.lifecycle(".env 에서 환경변수 ${loadedCount}개 로드됨 (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, JWT_SECRET 중)")
		}
	}
}
